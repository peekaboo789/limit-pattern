name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-dev.txt
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Python 测试
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            echo "运行 tests/"
            python -m pytest -q tests
          else
            echo "tests/ 不存在，跳过"
          fi
          if [ -d desktop/tests ]; then
            echo "运行 desktop/tests"
            python -m pytest -q desktop/tests
          else
            echo "desktop/tests 不存在，跳过"
          fi

      - name: 安装 Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建前端
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build
          test -f dist/index.html
