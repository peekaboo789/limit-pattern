name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-dev.txt
            desktop/requirements-build.txt

      - name: 打包绿色版
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      # 打包日志里留一份可直接对账的指纹：本机能核对下载到的 zip 是不是这一趟出的件。
      - name: 记录产物指纹
        if: always()
        shell: pwsh
        run: |
          $zip = "desktop/dist/LimitPattern-win64.zip"
          if (Test-Path $zip) {
            $item = Get-Item $zip
            Write-Host "zip 大小 $($item.Length) 字节"
            Write-Host "zip md5 $((Get-FileHash -Algorithm MD5 $zip).Hash.ToLower())"
            Write-Host "zip sha256 $((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower())"
            # 中文标签由 PowerShell 打：runner 上 python 的 stdout 是 cp1252，print 汉字会 UnicodeEncodeError 把这步打红。
            $entries = python -c "import zipfile; print(len(zipfile.ZipFile('desktop/dist/LimitPattern-win64.zip').namelist()))"
            if ($LASTEXITCODE -ne 0) { throw "读不动 zip 条目" }
            Write-Host "zip 条目数 $entries"
          } else {
            Write-Host "zip 不存在，本趟没出件"
          }
          $status = "desktop/dist/onefile_status.txt"
          if (Test-Path $status) {
            $onefile = (Get-Content $status -Raw -Encoding UTF8).Trim()
            Write-Host "单文件版 $onefile"
          }

      - name: 上传 LimitPattern-win64.zip
        uses: actions/upload-artifact@v4
        with:
          name: LimitPattern-win64.zip
          path: desktop/dist/LimitPattern-win64.zip
          if-no-files-found: error
          compression-level: 0

      # 冒烟挂了的时候，launcher.log 是唯一能说清挂在启动哪一步的东西，成败都要留。
      - name: 上传冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher.log
          path: ${{ runner.temp }}/lp-smoke/logs/launcher.log
          if-no-files-found: ignore
          compression-level: 0
