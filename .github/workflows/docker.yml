name: Docker image

on:
  push:
    branches: ["cursor/limit-pattern-system-8abb", "main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('backend/app/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: limit-pattern:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and hit /api/health
        run: |
          docker run -d --name lp -p 8000:8000 -e LP_AUTO_SYNC=0 -e LP_PASSWORD=ci-only-pass limit-pattern:smoke
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/settings)" = "401"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="app"'
          test "$(docker inspect -f '{{.State.Health.Status}}' lp)" != "unhealthy"
          docker exec lp date
          docker logs lp | tail -20
          docker rm -f lp

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/limit-pattern
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
